<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="sans-serif" font-size="13" fill="#222">
  <title>Twins at a lag: the images of the seed among the streams</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <!-- The cycle of 2^48 states, cut into five parts of one stream each. -->
  <circle cx="220" cy="232" r="130" fill="none" stroke="#222" stroke-width="3"/>
  <!-- Part boundaries, one stride apart. -->
  <line x1="220.0" y1="111.0" x2="220.0" y2="93.0" stroke="#222" stroke-width="2"/>
  <line x1="335.1" y1="194.6" x2="352.2" y2="189.0" stroke="#222" stroke-width="2"/>
  <line x1="291.1" y1="329.9" x2="301.7" y2="344.5" stroke="#222" stroke-width="2"/>
  <line x1="148.9" y1="329.9" x2="138.3" y2="344.5" stroke="#222" stroke-width="2"/>
  <line x1="104.9" y1="194.6" x2="87.8" y2="189.0" stroke="#222" stroke-width="2"/>
  <!-- Stream labels inside the ring. -->
  <text x="278.8" y="155.6" text-anchor="middle">stream 0</text>
  <text x="315.1" y="267.4" text-anchor="middle">stream 1</text>
  <text x="220.0" y="336.5" text-anchor="middle">stream 2</text>
  <text x="124.9" y="267.4" text-anchor="middle">stream 3</text>
  <text x="161.2" y="155.6" text-anchor="middle">stream 4</text>
  <text x="220" y="228" text-anchor="middle">five streams,</text>
  <text x="220" y="246" text-anchor="middle">one part each</text>
  <!-- The seed: where stream 0 starts. -->
  <circle cx="220.0" cy="102.0" r="5" fill="#c33"/>
  <text x="220" y="70" text-anchor="middle">seed: stream 0 starts here</text>
  <!-- Drawing direction. -->
  <path d="M 246.4 82.3 A 152 152 0 0 1 317.7 115.6" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="329" y="111">one step per draw</text>
  <!-- The images of the seed: a quarter, a half and three quarters of the
       turn later, a stream draws stream 0's values plus that fraction. -->
  <circle cx="350.0" cy="232.0" r="5" fill="#fff" stroke="#c33" stroke-width="2"/>
  <circle cx="220.0" cy="362.0" r="5" fill="#fff" stroke="#c33" stroke-width="2"/>
  <circle cx="90.0" cy="232.0" r="5" fill="#fff" stroke="#c33" stroke-width="2"/>
  <text x="394" y="236.5">+ 1/4</text>
  <text x="220" y="384" text-anchor="middle">+ 1/2</text>
  <text x="80" y="236.5" text-anchor="end">+ 3/4</text>
  <!-- The quarter image lies d steps after the start of stream 1 and
       stride - d steps before the start of stream 2. -->
  <line x1="352.2" y1="189.0" x2="370.3" y2="183.2" stroke="#222" stroke-width="1.5"/>
  <line x1="357.0" y1="232.0" x2="378.0" y2="232.0" stroke="#222" stroke-width="1.5"/>
  <line x1="301.7" y1="344.5" x2="312.9" y2="359.8" stroke="#222" stroke-width="1.5"/>
  <path d="M 362.7 185.6 A 150 150 0 0 1 370.0 232.0" fill="none" stroke="#222" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M 370.0 232.0 A 150 150 0 0 1 308.2 353.4" fill="none" stroke="#222" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="388" y="209">d</text>
  <text x="373" y="314">stride - d</text>
  <text x="320" y="412" text-anchor="middle">hollow dots: the images of the seed, where a stream draws stream 0's</text>
  <text x="320" y="428" text-anchor="middle">values plus 1/4, 1/2 or 3/4; the returned length is the smallest distance</text>
  <text x="320" y="444" text-anchor="middle">between an image and a stream start, here a quarter of the stride</text>
</svg>
