---
name: CMake

# Documentation content under doc/ does not affect this build, only the
# CMakeLists.txt files there do, so they are added back after the doc/**
# exclusion (later patterns take precedence).
on:
  push:
    paths:
      - "**"
      - "!doc/**"
      - "doc/CMakeLists.txt"
      - "doc/**/CMakeLists.txt"
    branches:
      - main
      - releasebranch_*
  pull_request:
    paths:
      - "**"
      - "!doc/**"
      - "doc/CMakeLists.txt"
      - "doc/**/CMakeLists.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  CMAKE_UNITY_BUILD: OFF

permissions:
  contents: read

jobs:
  build-cmake:
    runs-on: ubuntu-24.04
    env:
      CMAKE_VERSION: "3.22.0"
    steps:
      - name: Checkout GRASS
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Cache CMake download
        id: cached-cmake
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cmake-*.tar.gz
          key: cmake-${{ env.CMAKE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Download CMake
        if: steps.cached-cmake.outputs.cache-hit != 'true'
        run: |
          cd "${GITHUB_WORKSPACE}" || exit
          arch="$(echo "$(uname -s)"-"$(uname -m)" | awk '{print tolower($0)}')"
          v="v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-${arch}.tar.gz"
          wget "https://github.com/Kitware/CMake/releases/download/$v"
      - name: Save CMake download to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Do not write to cache on pull_request events to prevent cache poisoning.
        # Fork PRs can otherwise overwrite shared cache keys used by main branch runs.
        if: steps.cached-cmake.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        with:
          path: cmake-*.tar.gz
          key: cmake-${{ env.CMAKE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install CMake
        run: |
          cd "${GITHUB_WORKSPACE}" || exit
          arch="$(echo "$(uname -s)"-"$(uname -m)" | awk '{print tolower($0)}')"
          tar xzf "cmake-${CMAKE_VERSION}-${arch}.tar.gz"
          echo "CMAKE_DIR=${GITHUB_WORKSPACE}/cmake-${CMAKE_VERSION}-${arch}/bin" >> "${GITHUB_ENV}"
          echo "${GITHUB_WORKSPACE}/cmake-${CMAKE_VERSION}-${arch}/bin" >> "${GITHUB_PATH}"
      - run: |
          cmake --version
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget git gawk findutils ninja-build libpq-dev \
            gettext unixodbc-dev libnetcdf-dev python3-wxgtk4.0
          LC_ALL=C.UTF-8 sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update -y
          xargs -a <(awk '! /^ *(#|$)/' ".github/workflows/apt.txt") -r -- \
              sudo apt-get install -y --no-install-recommends --no-install-suggests
      - name: Print build environment variables
        shell: bash -el {0}
        run: |
          printenv | sort
          gcc --version
          ldd --version
      - name: Create installation directory
        run: |
          mkdir "${HOME}/install"
      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          verbose: 2
          evict-old-files: 7d
          key: ${{ github.workflow }}-${{ github.job }}
      - name: Configure
        run: |
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="${HOME}/install" -DWITH_READLINE=ON -DWITH_ODBC=ON \
            -DWITH_NETCDF=ON -DWITH_BZLIB=ON
      - name: Print CMakeCache.txt
        shell: bash -el {0}
        run: |
          cat "${GITHUB_WORKSPACE}/build/CMakeCache.txt"
      - name: Build
        run: |
          cmake --build build --verbose -j"$(nproc)"
      - name: Install
        run: |
          cmake --install "${GITHUB_WORKSPACE}/build" --verbose
      - name: Add the bin directory to PATH
        run: |
          echo "${HOME}/install/bin" >> "${GITHUB_PATH}"
      - name: Print installed versions
        if: always()
        run: .github/workflows/print_versions.sh
      - name: Test executing of the grass command
        run: .github/workflows/test_simple.sh
      - name: Cache GRASS Sample Dataset
        id: cached-data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sample-data/nc_spm_full_v2beta1.tar.gz
          key: nc_spm_full_v2beta1.tar.gz
          enableCrossOsArchive: true
      - name: Download GRASS Sample Dataset
        if: steps.cached-data.outputs.cache-hit != 'true'
        run: |
          mkdir -p sample-data
          curl -L "${SAMPLE_DATA}" -o sample-data/nc_spm_full_v2beta1.tar.gz
        env:
          SAMPLE_DATA: "https://grass.osgeo.org/sampledata/north_carolina/\
            nc_spm_full_v2beta1.tar.gz"
      - name: Save GRASS Sample Dataset to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Do not write to cache on pull_request events to prevent cache poisoning.
        # Fork PRs can otherwise overwrite shared cache keys used by main branch runs.
        if: steps.cached-data.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        with:
          path: sample-data/nc_spm_full_v2beta1.tar.gz
          key: nc_spm_full_v2beta1.tar.gz
      - name: Run tests
        run: .github/workflows/test_thorough.sh --config .gunittest.cfg --min-success 100
        env:
          SAMPLE_DATA_URL: "file://${{ github.workspace }}/sample-data/\
            nc_spm_full_v2beta1.tar.gz"
      - name: Make HTML test report available
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testreport-CMake
          path: testreport
          retention-days: 3
